<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CosaNostraShop</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #000;
      color: white;
      padding: 20px;
      text-align: center;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 16px;
      color: #ccc;
      margin-bottom: 20px;
    }

    .product {
      background-color: #111;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      padding: 20px;
      margin: 0 auto 30px;
      max-width: 350px;
    }

    video {
      width: 100%;
      border-radius: 8px;
    }

    .product h2 {
      margin: 15px 0 5px;
    }

    .product p {
      font-size: 16px;
      margin-bottom: 10px;
    }

    .stock {
      color: #0f0;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .stock::before {
      content: "✅ ";
    }

    .quantity-input {
      width: 60px;
      padding: 5px;
      margin: 5px 0;
      border-radius: 5px;
      border: 1px solid #666;
      background-color: #000;
      color: white;
      text-align: center;
    }

    .product button.add-btn {
      background-color: #0088cc;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 5px;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
    }

    .product button.add-btn:hover {
      background-color: #006699;
    }

    .cart {
      background-color: #111;
      padding: 15px;
      border-radius: 10px;
      margin-top: 20px;
      box-shadow: 0 0 8px rgba(0,0,0,0.6);
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }

    .cart h3 {
      margin-bottom: 10px;
    }

    .cart ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .cart ul li {
      margin-bottom: 8px;
      font-size: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cart ul li .item-text {
      flex-grow: 1;
      text-align: left;
    }

    .remove-btn {
      background-color: #c00;
      border: none;
      color: white;
      padding: 4px 8px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 13px;
    }

    .cart-total {
      font-weight: bold;
      margin-top: 10px;
      font-size: 16px;
    }

    .cart a button {
      background-color: #0a0;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      margin-top: 10px;
      font-size: 15px;
      cursor: pointer;
    }

    button.close-btn {
      background-color: #444;
      margin-top: 30px;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
    }

    button.close-btn:hover {
      background-color: #222;
    }
  </style>
</head>
<body>

  <h1>CosaNostraShop</h1>
  <div class="subtitle">Livraison 7/7 — 14h à 00h</div>

  <!-- PRODUIT : Hash Dry -->
  <div class="product" data-name="Hash Dry">
    <video controls>
      <source src="https://cosaapp.github.io/Mini-app-/C465B181-B5CF-4BE4-AB9A-2EE261FB99B8.mp4" type="video/mp4">
    </video>
    <h2>Hash Dry</h2>
    <p>6€/g jusqu’à 5g — puis 5€/g</p>
    <div class="stock">Stock disponible</div>
    <input class="quantity-input" type="number" min="1" value="1" />
    <button class="add-btn">Ajouter au panier</button>
  </div>

  <!-- PRODUIT : Weed OG -->
  <div class="product" data-name="Weed OG">
    <video controls>
      <source src="https://raw.githubusercontent.com/cosaapp/Mini-app-/Main/2.mp4.MP4" type="video/mp4">
    </video>
    <h2>Weed OG</h2>
    <p>8€/g — 10g = 80€</p>
    <div class="stock">Stock disponible</div>
    <input class="quantity-input" type="number" min="1" value="1" />
    <button class="add-btn">Ajouter au panier</button>
  </div>

  <!-- PANIER -->
  <div class="cart" id="cart">
    <h3>🛒 Panier</h3>
    <ul id="cart-items"></ul>
    <div class="cart-total">Total : 0€</div>
    <a href="https://www.snapchat.com/add/cosa2nostra" target="_blank">
      <button>Commander sur Snap</button>
    </a>
  </div>

  <button class="close-btn" onclick="window.Telegram.WebApp.close()">Fermer l'app</button>

  <script>
    const cartItems = {};
    const cartList = document.getElementById("cart-items");
    const cartTotal = document.querySelector(".cart-total");

    function updateCart() {
      cartList.innerHTML = '';
      let total = 0;

      for (const name in cartItems) {
        const item = cartItems[name];
        total += item.total;

        const li = document.createElement("li");

        const itemText = document.createElement("span");
        itemText.className = "item-text";
        itemText.textContent = `${item.name} × ${item.quantity}g = ${item.total}€`;

        const removeBtn = document.createElement("button");
        removeBtn.className = "remove-btn";
        removeBtn.textContent = "🗑️";
        removeBtn.addEventListener("click", () => {
          delete cartItems[name];
          updateCart();
        });

        li.appendChild(itemText);
        li.appendChild(removeBtn);
        cartList.appendChild(li);
      }

      cartTotal.textContent = `Total : ${total}€`;
    }

    document.querySelectorAll('.add-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const product = btn.closest('.product');
        const name = product.dataset.name;
        const quantity = parseInt(product.querySelector('.quantity-input').value);

        if (isNaN(quantity) || quantity <= 0) return;

        let totalPrice = 0;

        if (name === 'Hash Dry') {
          totalPrice = quantity <= 5 ? quantity * 6 : quantity * 5;
        } else if (name === 'Weed OG') {
          totalPrice = quantity === 10 ? 80 : quantity * 8;
        }

        cartItems[name] = {
          name: name,
          quantity: quantity,
          total: totalPrice
        };

        updateCart();
      });
    });
  </script>

</body>
</html>
