<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CosaNostraShop</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #000;
      color: white;
      padding: 20px;
      text-align: center;
    }
    h1 {
      color: white;
      margin-bottom: 10px;
      font-size: 26px;
    }
    .subtitle {
      color: #ccc;
      font-size: 16px;
      margin-bottom: 20px;
    }

    /* Bouton catégories transparent avec contour */
    .dropdown {
      position: relative;
      display: inline-block;
      margin-bottom: 30px;
    }
    .dropbtn {
      background-color: transparent;
      color: white;
      border: 2px solid white;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
      min-width: 130px;
      text-align: left;
      user-select: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .dropbtn:focus {
      outline: none;
      box-shadow: 0 0 5px #0088cc;
    }
    /* Petite flèche à droite */
    .dropbtn::after {
      content: '▼';
      font-size: 12px;
      margin-left: 10px;
      opacity: 0.7;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      background-color: #111;
      min-width: 130px;
      border: 1px solid #555;
      border-radius: 5px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.7);
      z-index: 1;
      left: 0;
      margin-top: 5px;
      text-align: left;
    }
    .dropdown-content button {
      background-color: transparent;
      color: white;
      border: none;
      padding: 10px 15px;
      width: 100%;
      text-align: left;
      font-size: 15px;
      cursor: pointer;
      border-radius: 0;
      transition: background-color 0.3s ease;
    }
    .dropdown-content button:hover {
      background-color: #0088cc;
      color: white;
    }

    .product {
      background-color: #111;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      padding: 20px;
      margin: 0 auto 30px;
      max-width: 350px;
      display: none; /* Masqué par défaut */
    }
    video {
      width: 100%;
      border-radius: 8px;
    }
    .product h2 {
      margin: 15px 0 5px;
      color: white;
    }
    .product p {
      font-size: 16px;
      color: #ccc;
      margin-bottom: 15px;
    }
    .product button {
      background-color: #0088cc;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      font-size: 15px;
      cursor: pointer;
    }
    .product button:hover {
      background-color: #006699;
    }
    button.close-btn {
      background-color: #444;
      margin-top: 20px;
      padding: 10px 20px;
      border-radius: 5px;
      font-size: 15px;
      cursor: pointer;
    }
    button.close-btn:hover {
      background-color: #222;
    }
  </style>
</head>
<body>

  <h1>CosaNostraShop</h1>
  <div class="subtitle">Livraison 7/7 — 14h à 00h</div>

  <div class="dropdown">
    <button class="dropbtn" id="categoryBtn">Catégories</button>
    <div class="dropdown-content" id="dropdownMenu">
      <button data-category="all">Tous</button>
      <button data-category="weed">Weed</button>
      <button data-category="hash">Hash</button>
    </div>
  </div>

  <!-- Produit 1 : Hash Dry -->
  <div class="product" data-category="hash">
    <video controls>
      <source src="https://cosaapp.github.io/Mini-app-/C465B181-B5CF-4BE4-AB9A-2EE261FB99B8.mp4" type="video/mp4">
      Votre navigateur ne supporte pas la lecture de vidéo.
    </video>
    <h2>Hash Dry</h2>
    <p>Prix : 5€ le gramme</p>
    <a href="https://www.snapchat.com/add/cosa2nostra" target="_blank" rel="noopener">
      <button>Commander</button>
    </a>
  </div>

  <!-- Produit 2 : Weed -->
  <div class="product" data-category="weed">
    <video controls>
      <source src="https://raw.githubusercontent.com/cosaapp/Mini-app-/Main/2.mp4.MP4" type="video/mp4">
      Votre navigateur ne supporte pas la lecture de vidéo.
    </video>
    <h2>Weed</h2>
    <p>Prix : 8€ le gramme</p>
    <a href="https://www.snapchat.com/add/cosa2nostra" target="_blank" rel="noopener">
      <button>Commander</button>
    </a>
  </div>

  <button class="close-btn" onclick="window.Telegram.WebApp.close()">Fermer l'app</button>

  <script>
    const categoryBtn = document.getElementById('categoryBtn');
    const dropdownMenu = document.getElementById('dropdownMenu');
    const products = document.querySelectorAll('.product');

    // Fonction pour afficher les produits selon catégorie
    function showProducts(category) {
      products.forEach(product => {
        if (category === 'all' || product.dataset.category === category) {
          product.style.display = 'block';
        } else {
          product.style.display = 'none';
        }
      });
    }

    // Par défaut on affiche tous
    showProducts('all');

    // Toggle affichage dropdown
    categoryBtn.addEventListener('click', () => {
      const isVisible = dropdownMenu.style.display === 'block';
      dropdownMenu.style.display = isVisible ? 'none' : 'block';
    });

    // Clic sur une catégorie dans le menu
    dropdownMenu.querySelectorAll('button').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const selectedCategory = e.target.getAttribute('data-category');
        showProducts(selectedCategory);
        categoryBtn.textContent = btn.textContent + " ▼"; // Affiche la catégorie choisie
        dropdownMenu.style.display = 'none';
      });
    });

    // Clic en dehors du menu dropdown ferme le menu
    window.addEventListener('click', (e) => {
      if (!categoryBtn.contains(e.target) && !dropdownMenu.contains(e.target)) {
        dropdownMenu.style.display = 'none';
      }
    });
  </script>

</body>
</html>
