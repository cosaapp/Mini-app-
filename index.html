<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CosaNostraShop</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #000;
      color: white;
      padding: 20px;
      text-align: center;
      overflow-x: hidden;
    }

    body::after {
      content: "Cosa Nostra Cosa Nostra Cosa Nostra Cosa Nostra ";
      font-size: 20px;
      color: rgba(255,255,255,0.03);
      white-space: pre;
      position: fixed;
      top: 0;
      left: 0;
      transform: rotate(-45deg);
      width: 300%;
      height: 300%;
      pointer-events: none;
      z-index: 0;
      line-height: 60px;
    }

    body > * {
      position: relative;
      z-index: 1;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 16px;
      color: #ccc;
      margin-bottom: 20px;
    }

    .product {
      background-color: #111;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      padding: 20px;
      margin: 0 auto 30px;
      max-width: 350px;
    }

    video {
      width: 100%;
      border-radius: 8px;
    }

    .product h2 {
      margin: 15px 0 5px;
    }

    .product p {
      font-size: 16px;
      margin-bottom: 10px;
    }

    .stock {
      color: #0f0;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .stock::before {
      content: "✅ ";
    }

    .product select {
      margin-top: 10px;
      padding: 6px;
      font-size: 15px;
      border-radius: 5px;
    }

    .product button.add-btn {
      background-color: #0088cc;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 5px;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
    }

    .product button.add-btn:hover {
      background-color: #006699;
    }

    .cart {
      background-color: #111;
      padding: 15px;
      border-radius: 10px;
      margin-top: 20px;
      box-shadow: 0 0 8px rgba(0,0,0,0.6);
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }

    .cart h3 {
      margin-bottom: 10px;
    }

    .cart ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .cart ul li {
      margin-bottom: 8px;
      font-size: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cart ul li .item-text {
      flex-grow: 1;
      text-align: left;
    }

    .remove-btn {
      background-color: #c00;
      border: none;
      color: white;
      padding: 4px 8px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 13px;
    }

    .cart-total {
      font-weight: bold;
      margin-top: 10px;
      font-size: 16px;
    }

    .cart a button {
      background-color: #0a0;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      margin-top: 10px;
      font-size: 15px;
      cursor: pointer;
    }

    .copy-btn {
      background-color: #555;
      margin-top: 10px;
      padding: 10px 20px;
      border-radius: 5px;
      font-size: 15px;
      color: white;
      border: none;
      cursor: pointer;
    }

    button.close-btn {
      background-color: #444;
      margin-top: 30px;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
    }

    button.close-btn:hover {
      background-color: #222;
    }
  </style>
</head>
<body>

  <h1>CosaNostraShop</h1>
  <div class="subtitle">Livraison 7/7 — 14h à 00h</div>

  <!-- PRODUIT HASH -->
  <div class="product" data-name="Hash Dry">
    <video controls>
      <source src="https://cosaapp.github.io/Mini-app-/C465B181-B5CF-4BE4-AB9A-2EE261FB99B8.mp4" type="video/mp4">
    </video>
    <h2>Hash Dry</h2>
    <p>6€/g jusqu’à 5g, 5€/g au-delà</p>
    <div class="stock">Stock disponible</div>
    <select>
      <option value="1">1g</option>
      <option value="2">2g</option>
      <option value="3">3g</option>
      <option value="4">4g</option>
      <option value="5">5g</option>
      <option value="6">6g</option>
      <option value="10">10g</option>
    </select>
    <button class="add-btn">Ajouter au panier</button>
  </div>

  <!-- PRODUIT WEED -->
  <div class="product" data-name="Weed OG">
    <video controls>
      <source src="https://raw.githubusercontent.com/cosaapp/Mini-app-/Main/2.mp4.MP4" type="video/mp4">
    </video>
    <h2>Weed OG</h2>
    <p>8€/g ou 10g = 80€</p>
    <div class="stock">Stock disponible</div>
    <select>
      <option value="1">1g</option>
      <option value="2">2g</option>
      <option value="5">5g</option>
      <option value="10">10g</option>
    </select>
    <button class="add-btn">Ajouter au panier</button>
  </div>

  <!-- PANIER -->
  <div class="cart" id="cart">
    <h3>🛒 Panier</h3>
    <ul id="cart-items"></ul>
    <div class="cart-total">Total : 0€</div>
    <button class="copy-btn" onclick="copyCart()">📋 Copier la commande pour Snapchat</button>
    <a href="https://www.snapchat.com/add/cosa2nostra" target="_blank">
      <button>Commander sur Snap</button>
    </a>
  </div>

  <button class="close-btn" onclick="window.Telegram.WebApp.close()">Fermer l'app</button>

  <script>
    const cartItems = {};
    const cartList = document.getElementById("cart-items");
    const cartTotal = document.querySelector(".cart-total");

    function updateCart() {
      cartList.innerHTML = '';
      let total = 0;

      for (const name in cartItems) {
        const item = cartItems[name];
        total += item.totalPrice;

        const li = document.createElement("li");

        const itemText = document.createElement("span");
        itemText.className = "item-text";
        itemText.textContent = `${item.name} × ${item.quantity}g = ${item.totalPrice}€`;

        const removeBtn = document.createElement("button");
        removeBtn.className = "remove-btn";
        removeBtn.textContent = "🗑️";
        removeBtn.addEventListener("click", () => {
          if (item.quantity > 1) {
            item.quantity--;
          } else {
            delete cartItems[name];
            updateCart();
            return;
          }
          item.totalPrice = calculatePrice(item.name, item.quantity);
          updateCart();
        });

        li.appendChild(itemText);
        li.appendChild(removeBtn);
        cartList.appendChild(li);
      }

      cartTotal.textContent = `Total : ${total}€`;
    }

    function calculatePrice(name, quantity) {
      if (name === "Hash Dry") {
        return quantity <= 5 ? quantity * 6 : quantity * 5;
      } else if (name === "Weed OG") {
        return quantity === 10 ? 80 : quantity * 8;
      }
      return 0;
    }

    document.querySelectorAll('.add-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const product = btn.closest('.product');
        const name = product.dataset.name;
        const quantity = parseInt(product.querySelector("select").value);

        if (!cartItems[name]) {
          cartItems[name] = { name, quantity };
        } else {
          cartItems[name].quantity += quantity;
        }

        cartItems[name].totalPrice = calculatePrice(name, cartItems[name].quantity);
        updateCart();
      });
    });

    function copyCart() {
      let text = '🛒 Ma commande :\n';
      let total = 0;

      for (const name in cartItems) {
        const item = cartItems[name];
        text += `• ${item.name} × ${item.quantity}g = ${item.totalPrice}€\n`;
        total += item.totalPrice;
      }

      text += `\n💶 Total : ${total}€`;

      navigator.clipboard.writeText(text).then(() => {
        alert("Commande copiée pour Snapchat !");
      });
    }
  </script>

</body>
</html>
