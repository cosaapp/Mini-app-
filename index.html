<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Livraison 7/7</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      padding: 20px;
      text-align: center;
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
    }
    .card {
      display: inline-block;
      width: 150px;
      margin: 10px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      cursor: pointer;
      background: white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      vertical-align: top;
    }
    .card img {
      width: 150px;
      height: 100px;
      border-radius: 6px;
      object-fit: cover;
    }
    .card h3 {
      margin-top: 8px;
      font-size: 16px;
      color: #333;
    }
    .product {
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 20px;
      margin: 0 auto 30px;
      max-width: 350px;
      text-align: left;
    }
    video {
      width: 100%;
      border-radius: 8px;
      display: block;
      margin-bottom: 15px;
    }
    .product h2 {
      margin: 15px 0 5px;
      color: #333;
    }
    .product p {
      font-size: 16px;
      color: #666;
      margin-bottom: 15px;
    }
    .product button {
      background-color: #0088cc;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      font-size: 15px;
      cursor: pointer;
    }
    .product button:hover {
      background-color: #006699;
    }
    button.close-btn {
      background-color: #444;
      margin-top: 20px;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
    }
    button.close-btn:hover {
      background-color: #222;
    }
  </style>
</head>
<body>

  <h1>Livraison 7/7</h1>

  <div id="home">
    <!-- Miniature du produit -->
    <div class="card" onclick="afficherProduit('Hash Dry', 5, 'https://raw.githubusercontent.com/Cosaapp/mini-app-produits/main/C465B181-B5CF-4BE4-AB9A-2EE261FB99B8.mp4')">
      <img src="https://raw.githubusercontent.com/Cosaapp/mini-app-produits/main/IMG_1146.webp" alt="Hash Dry" />
      <h3>Hash Dry</h3>
    </div>
  </div>

  <div id="product" style="display:none;">
    <div class="product">
      <video controls id="product-video">
        <source src="" type="video/mp4" />
        Votre navigateur ne supporte pas la lecture de vidéo.
      </video>
      <h2 id="product-name"></h2>
      <p id="product-price"></p>
      <a href="https://t.me/Cosa2NostraBot"><button>Commander</button></a>
    </div>
    <button class="close-btn" onclick="retourAccueil()">Retour</button>
  </div>

  <script>
    function afficherProduit(nom, prix, videoUrl) {
      document.getElementById('home').style.display = 'none';
      document.getElementById('product').style.display = 'block';
      document.getElementById('product-name').textContent = nom;
      document.getElementById('product-price').textContent = `Prix : ${prix}€ le gramme`;
      document.getElementById('product-video').querySelector('source').src = videoUrl;
      document.getElementById('product-video').load();
    }

    function retourAccueil() {
      document.getElementById('product').style.display = 'none';
      document.getElementById('home').style.display = 'block';
    }
  </script>

</body>
</html>
