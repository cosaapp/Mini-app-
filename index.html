<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CosaNostraShop</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: black;
      color: white;
      padding: 20px;
      text-align: center;
      background-image: repeating-linear-gradient(
        45deg,
        rgba(255,255,255,0.05) 0,
        rgba(255,255,255,0.05) 1px,
        transparent 1px,
        transparent 40px
      ),
      repeating-linear-gradient(
        -45deg,
        rgba(255,255,255,0.05) 0,
        rgba(255,255,255,0.05) 1px,
        transparent 1px,
        transparent 40px
      );
      background-size: 40px 40px;
    }

    body::before {
      content: "Cosa Nostra Cosa Nostra Cosa Nostra Cosa Nostra Cosa Nostra";
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      font-size: 40px;
      color: rgba(255,255,255,0.02);
      transform: rotate(-45deg);
      white-space: nowrap;
      pointer-events: none;
      z-index: 0;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 10px;
      position: relative;
      z-index: 1;
    }

    .subtitle {
      font-size: 16px;
      color: #ccc;
      margin-bottom: 20px;
      position: relative;
      z-index: 1;
    }

    .product {
      background-color: #111;
      border-radius: 10px;
      padding: 20px;
      margin: 0 auto 30px;
      max-width: 350px;
      position: relative;
      z-index: 1;
    }

    video {
      width: 100%;
      border-radius: 8px;
    }

    .product h2 {
      margin: 15px 0 5px;
    }

    .stock {
      color: #0f0;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .stock::before {
      content: "✅ ";
    }

    .product select {
      padding: 5px;
      margin: 10px 0;
    }

    .product button.add-btn {
      background-color: #0088cc;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 5px;
      font-size: 15px;
      cursor: pointer;
    }

    .cart {
      background-color: #111;
      padding: 15px;
      border-radius: 10px;
      margin-top: 20px;
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
      position: relative;
      z-index: 1;
    }

    .cart ul {
      list-style: none;
      padding: 0;
    }

    .cart ul li {
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 15px;
    }

    .remove-btn {
      background-color: #c00;
      border: none;
      color: white;
      padding: 5px 8px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 13px;
    }

    .cart-total {
      font-weight: bold;
      margin-top: 10px;
      font-size: 16px;
    }

    .cart button {
      background-color: #0a0;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      margin-top: 10px;
      font-size: 15px;
      cursor: pointer;
    }

    .copy-btn {
      background-color: #444;
      margin-top: 10px;
    }

    .copy-btn:hover {
      background-color: #666;
    }

    .close-btn {
      background-color: #222;
      margin-top: 30px;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
    }

    .close-btn:hover {
      background-color: #000;
    }
  </style>
</head>
<body>

  <h1>CosaNostraShop</h1>
  <div class="subtitle">Livraison 7/7 — 14h à 00h</div>

  <!-- Produit 1 : Hash Dry -->
  <div class="product" data-name="Hash Dry">
    <video autoplay muted loop playsinline>
      <source src="https://cosaapp.github.io/Mini-app-/C465B181-B5CF-4BE4-AB9A-2EE261FB99B8.mp4" type="video/mp4">
    </video>
    <h2>Hash Dry</h2>
    <div class="stock">Stock disponible</div>
    <label>Quantité :
      <select class="quantity-select">
        <option value="1">1g</option>
        <option value="2">2g</option>
        <option value="3">3g</option>
        <option value="4">4g</option>
        <option value="5">5g</option>
        <option value="6">6g</option>
        <option value="7">7g</option>
        <option value="8">8g</option>
        <option value="9">9g</option>
        <option value="10">10g</option>
      </select>
    </label>
    <button class="add-btn">Ajouter au panier</button>
  </div>

  <!-- Produit 2 : Weed OG -->
  <div class="product" data-name="Weed OG">
    <video autoplay muted loop playsinline>
      <source src="https://raw.githubusercontent.com/cosaapp/Mini-app-/Main/2.mp4.MP4" type="video/mp4">
    </video>
    <h2>Weed OG</h2>
    <div class="stock">Stock disponible</div>
    <label>Quantité :
      <select class="quantity-select">
        <option value="1">1g</option>
        <option value="2">2g</option>
        <option value="3">3g</option>
        <option value="4">4g</option>
        <option value="5">5g</option>
        <option value="6">6g</option>
        <option value="7">7g</option>
        <option value="8">8g</option>
        <option value="9">9g</option>
        <option value="10">10g</option>
      </select>
    </label>
    <button class="add-btn">Ajouter au panier</button>
  </div>

  <!-- PANIER -->
  <div class="cart" id="cart">
    <h3>🛒 Panier</h3>
    <ul id="cart-items"></ul>
    <div class="cart-total">Total : 0€</div>
    <button onclick="copyCart()">📋 Copier la commande pour Snapchat</button>
    <a href="https://www.snapchat.com/add/cosa2nostra" target="_blank">
      <button>Commander sur Snap</button>
    </a>
  </div>

  <button class="close-btn" onclick="window.Telegram.WebApp.close()">Fermer l'app</button>

  <script>
    const cartItems = {};
    const cartList = document.getElementById("cart-items");
    const cartTotal = document.querySelector(".cart-total");

    function getPrice(name, quantity) {
      if (name === "Hash Dry") {
        return quantity <= 5 ? quantity * 6 : quantity * 5;
      }
      if (name === "Weed OG") {
        return Math.ceil((quantity / 10) * 80);
      }
      return 0;
    }

    function updateCart() {
      cartList.innerHTML = '';
      let total = 0;

      for (const name in cartItems) {
        const item = cartItems[name];
        const itemTotal = getPrice(name, item.quantity);
        total += itemTotal;

        const li = document.createElement("li");
        const itemText = document.createElement("span");
        itemText.className = "item-text";
        itemText.textContent = `${name} × ${item.quantity}g = ${itemTotal}€`;

        const removeBtn = document.createElement("button");
        removeBtn.className = "remove-btn";
        removeBtn.textContent = "🗑️";
        removeBtn.onclick = () => {
          item.quantity--;
          if (item.quantity <= 0) delete cartItems[name];
          updateCart();
        };

        li.appendChild(itemText);
        li.appendChild(removeBtn);
        cartList.appendChild(li);
      }

      cartTotal.textContent = `Total : ${total}€`;
    }

    function copyCart() {
      let text = "🛒 Commande :\n";
      for (const name in cartItems) {
        const item = cartItems[name];
        const itemTotal = getPrice(name, item.quantity);
        text += `- ${name} × ${item.quantity}g = ${itemTotal}€\n`;
      }
      navigator.clipboard.writeText(text.trim());
      alert("Commande copiée 📋");
    }

    document.querySelectorAll(".add-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        const product = btn.closest(".product");
        const name = product.dataset.name;
        const quantity = parseInt(product.querySelector(".quantity-select").value);

        if (!cartItems[name]) {
          cartItems[name] = { quantity };
        } else {
          cartItems[name].quantity += quantity;
        }

        updateCart();
      });
    });
  </script>

</body>
</html>
