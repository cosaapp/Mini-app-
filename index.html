<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Livraison 7/7</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f2f2f2;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    h1 {
      color: #222;
    }

    /* ACCUEIL */
    #accueil {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
    }

    .card {
      background-color: white;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      width: 150px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .card:hover {
      transform: scale(1.05);
    }

    .card img {
      width: 100%;
      border-top-left-radius: 10px;
      border-top-right-radius: 10px;
    }

    .card h3 {
      margin: 10px;
      font-size: 16px;
    }

    /* FICHE PRODUIT */
    #fiche-produit {
      display: none;
      margin-top: 30px;
      background-color: white;
      padding: 20px;
      border-radius: 10px;
      max-width: 350px;
      margin-left: auto;
      margin-right: auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    video {
      width: 100%;
      border-radius: 10px;
    }

    #fiche-produit h2 {
      margin: 15px 0 5px;
    }

    #fiche-produit p {
      font-size: 16px;
      color: #666;
      margin-bottom: 15px;
    }

    button {
      background-color: #0088cc;
      color: white;
      border: none;
      padding: 10px 20px;
      margin-top: 10px;
      border-radius: 5px;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background-color: #006699;
    }

    .secondary-btn {
      background-color: #555;
    }

    .secondary-btn:hover {
      background-color: #333;
    }
  </style>
</head>
<body>

  <h1 id="titre-principal">Livraison 7/7</h1>

  <!-- PAGE D'ACCUEIL -->
  <div id="accueil">
    <div class="card" onclick="afficherProduit('Hash Dry', 5, 'https://cosaapp.github.io/Mini-app-/C465B181-B5CF-4BE4-AB9A-2EE261FB99B8.mp4')">
      <img src="https://via.placeholder.com/150x100?text=Hash" alt="Hash">
      <h3>Hash Dry</h3>
    </div>
    <div class="card" onclick="afficherProduit('Weed', 8, 'https://cosaapp.github.io/Mini-app-/C465B181-B5CF-4BE4-AB9A-2EE261FB99B8.mp4')">
      <img src="https://via.placeholder.com/150x100?text=Weed" alt="Weed">
      <h3>Weed</h3>
    </div>
  </div>

  <!-- FICHE PRODUIT -->
  <div id="fiche-produit">
    <video id="video" controls>
      <source id="video-source" src="" type="video/mp4">
      Votre navigateur ne supporte pas la vidéo.
    </video>
    <h2 id="nom-produit">Nom du produit</h2>
    <p id="prix-produit">Prix : €</p>
    <a id="lien-commande" href="#" target="_blank"><button>Commander</button></a>
    <br />
    <button class="secondary-btn" onclick="retourAccueil()">Retour à l'accueil</button>
    <button class="secondary-btn" onclick="window.Telegram.WebApp.close()">Fermer l'app</button>
  </div>

  <script>
    function afficherProduit(nom, prix, videoUrl) {
      document.getElementById("titre-principal").textContent = nom;
      document.getElementById("nom-produit").textContent = nom;
      document.getElementById("prix-produit").textContent = `Prix : ${prix}€ le gramme`;
      document.getElementById("video-source").src = videoUrl;
      document.getElementById("video").load();
      document.getElementById("lien-commande").href = "https://t.me/Cosa2NostraBot";

      document.getElementById("accueil").style.display = "none";
      document.getElementById("fiche-produit").style.display = "block";
    }

    function retourAccueil() {
      document.getElementById("fiche-produit").style.display = "none";
      document.getElementById("accueil").style.display = "flex";
      document.getElementById("titre-principal").textContent = "Livraison 7/7";
    }
  </script>

</body>
</html>
