<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini App Telegram</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 50px;
      background-color: #f5f5f5;
    }

    h1 {
      color: #333;
    }

    button {
      padding: 15px 30px;
      font-size: 16px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      background-color: #0088cc;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background-color: #006699;
    }
  </style>
</head>
<body>

  <h1>Bienvenue dans la Mini App</h1>
  <p>Utilise les boutons ci-dessous :</p>

  <!-- Bouton pour fermer l'app Telegram -->
  <button onclick="window.Telegram.WebApp.close()">Fermer l'app</button>

  <!-- Bouton pour ouvrir le bot Telegram -->
  <a href="https://t.me/Cosa2NostraBot" target="_blank">
    <button>Ouvrir le bot</button>
  </a>

  <!-- Script Telegram Web App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</body>
</html>
