<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CosaNostraShop</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #000;
      color: white;
      padding: 20px;
      text-align: center;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 16px;
      color: #ccc;
      margin-bottom: 20px;
    }

    .dropdown {
      margin-bottom: 30px;
    }

    .dropbtn {
      background-color: transparent;
      border: 2px solid white;
      color: white;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      background-color: #111;
      border: 1px solid #555;
      border-radius: 5px;
      margin-top: 5px;
      z-index: 1;
    }

    .dropdown-content button {
      background: none;
      border: none;
      color: white;
      padding: 10px;
      text-align: left;
      cursor: pointer;
    }

    .product {
      background-color: #111;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      padding: 20px;
      margin: 0 auto 30px;
      max-width: 350px;
    }

    video {
      width: 100%;
      border-radius: 8px;
    }

    .product h2 {
      margin: 15px 0 5px;
    }

    .product p {
      font-size: 16px;
      margin-bottom: 10px;
    }

    .stock {
      color: #0f0;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .stock::before {
      content: "✅ ";
    }

    .product button.add-btn {
      background-color: #0088cc;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 5px;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
    }

    .product button.add-btn:hover {
      background-color: #006699;
    }

    .cart {
      background-color: #111;
      padding: 15px;
      border-radius: 10px;
      margin-top: 20px;
      box-shadow: 0 0 8px rgba(0,0,0,0.6);
      max-width: 400px;
      margin-left: auto;
      margin-right: auto;
    }

    .cart h3 {
      margin-bottom: 10px;
    }

    .cart ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .cart ul li {
      margin-bottom: 5px;
      font-size: 15px;
    }

    .cart-total {
      font-weight: bold;
      margin-top: 10px;
      font-size: 16px;
    }

    .cart a button {
      background-color: #0a0;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      margin-top: 10px;
      font-size: 15px;
      cursor: pointer;
    }

    button.close-btn {
      background-color: #444;
      margin-top: 30px;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
    }

    button.close-btn:hover {
      background-color: #222;
    }
  </style>
</head>
<body>

  <h1>CosaNostraShop</h1>
  <div class="subtitle">Livraison 7/7 — 14h à 00h</div>

  <!-- PRODUITS -->

  <div class="product" data-name="Hash Dry" data-price="5">
    <video controls>
      <source src="https://cosaapp.github.io/Mini-app-/C465B181-B5CF-4BE4-AB9A-2EE261FB99B8.mp4" type="video/mp4">
    </video>
    <h2>Hash Dry</h2>
    <p>Prix : 5€ le gramme</p>
    <div class="stock">Stock disponible</div>
    <button class="add-btn">Ajouter au panier</button>
  </div>

  <div class="product" data-name="Weed OG" data-price="8">
    <video controls>
      <source src="https://raw.githubusercontent.com/cosaapp/Mini-app-/Main/2.mp4.MP4" type="video/mp4">
    </video>
    <h2>Weed OG</h2>
    <p>Prix : 8€ le gramme</p>
    <div class="stock">Stock disponible</div>
    <button class="add-btn">Ajouter au panier</button>
  </div>

  <!-- PANIER -->
  <div class="cart" id="cart">
    <h3>🛒 Panier</h3>
    <ul id="cart-items"></ul>
    <div class="cart-total">Total : 0€</div>
    <a href="https://www.snapchat.com/add/cosa2nostra" target="_blank">
      <button>Commander sur Snap</button>
    </a>
  </div>

  <button class="close-btn" onclick="window.Telegram.WebApp.close()">Fermer l'app</button>

  <script>
    const cartItems = {};
    const cartList = document.getElementById("cart-items");
    const cartTotal = document.querySelector(".cart-total");

    function updateCart() {
      cartList.innerHTML = '';
      let total = 0;
      for (const name in cartItems) {
        const item = cartItems[name];
        total += item.price * item.quantity;
        const li = document.createElement("li");
        li.textContent = `${item.name} × ${item.quantity} = ${item.price * item.quantity}€`;
        cartList.appendChild(li);
      }
      cartTotal.textContent = `Total : ${total}€`;
    }

    document.querySelectorAll('.add-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const product = btn.closest('.product');
        const name = product.dataset.name;
        const price = parseFloat(product.dataset.price);

        if (!cartItems[name]) {
          cartItems[name] = { name, price, quantity: 1 };
        } else {
          cartItems[name].quantity += 1;
        }

        updateCart();
      });
    });
  </script>

</body>
</html>
