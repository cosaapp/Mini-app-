<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mini App Produits</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background: #f7f7f7;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    .products {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }
    .product {
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      width: 250px;
      padding: 15px;
      text-align: center;
    }
    .product img {
      max-width: 100%;
      border-radius: 8px;
    }
    .product h2 {
      font-size: 1.2em;
      margin: 10px 0 5px;
      color: #222;
    }
    .product p {
      color: #555;
      font-size: 0.95em;
      height: 60px;
      overflow: hidden;
    }
    .price {
      margin-top: 10px;
      font-weight: bold;
      color: #2a9d8f;
      font-size: 1.1em;
    }
  </style>
</head>
<body>
  <h1>Nos Produits</h1>
  <div class="products">
    <div class="product">
      <img src="https://via.placeholder.com/250x150?text=Produit+1" alt="Produit 1" />
      <h2>Produit 1</h2>
      <p>Une description rapide et claire du produit 1.</p>
      <div class="price">19,99 €</div>
    </div>
    <div class="product">
      <img src="https://via.placeholder.com/250x150?text=Produit+2" alt="Produit 2" />
      <h2>Produit 2</h2>
      <p>Une description rapide et claire du produit 2.</p>
      <div class="price">29,99 €</div>
    </div>
    <div class="product">
      <img src="https://via.placeholder.com/250x150?text=Produit+3" alt="Produit 3" />
      <h2>Produit 3</h2>
      <p>Une description rapide et claire du produit 3.</p>
      <div class="price">39,99 €</div>
    </div>
  </div>
</body>
</html>
