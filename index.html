<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Livraison 7/7</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      padding: 20px;
      text-align: center;
    }
    h1 {
      color: #333;
      margin-bottom: 30px;
    }
    .product {
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      padding: 20px;
      margin: 0 auto 30px;
      max-width: 350px;
    }
    video {
      width: 100%;
      border-radius: 8px;
    }
    .product h2 {
      margin: 15px 0 5px;
    }
    .product p {
      font-size: 16px;
      color: #666;
      margin-bottom: 15px;
    }
    .product button {
      background-color: #0088cc;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      font-size: 15px;
      cursor: pointer;
    }
    .product button:hover {
      background-color: #006699;
    }
    button.close-btn {
      background-color: #444;
      margin-top: 20px;
    }
    button.close-btn:hover {
      background-color: #222;
    }
  </style>
</head>
<body>

  <h1>Livraison 7/7</h1>

  <!-- Produit 1 : Hash Dry -->
  <div class="product">
    <video controls>
      <source src="https://raw.githubusercontent.com/Cosaapp/mini-app-produits/main/C465B181-B5CF-4BE4-AB9A-2EE261FB99B8.mp4" type="video/mp4">
      Votre navigateur ne supporte pas la lecture de vidéo.
    </video>
    <h2>Hash Dry</h2>
    <p>Prix : 5€ le gramme</p>
    <a href="https://t.me/Cosa2NostraBot"><button>Commander</button></a>
  </div>

  <!-- Produit 2 : Weed -->
  <div class="product">
    <video controls>
      <source src="https://raw.githubusercontent.com/Cosaapp/mini-app-produits/main/C465B181-B5CF-4BE4-AB9A-2EE261FB99B8.mp4" type="video/mp4">
      Votre navigateur ne supporte pas la lecture de vidéo.
    </video>
    <h2>Weed</h2>
    <p>Prix : 8€ le gramme</p>
    <a href="https://t.me/Cosa2NostraBot"><button>Commander</button></a>
  </div>

  <!-- Bouton Fermer l'app -->
  <button class="close-btn" onclick="window.Telegram.WebApp.close()">Fermer l'app</button>

</body>
</html>
