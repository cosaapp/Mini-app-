<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CosaNostraShop</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #000;
      color: white;
      padding: 20px;
      text-align: center;
    }
    h1 {
      color: white;
      margin-bottom: 10px;
      font-size: 26px;
    }
    .subtitle {
      color: #ccc;
      font-size: 16px;
      margin-bottom: 20px;
    }
    .category-buttons {
      margin-bottom: 30px;
    }
    .category-buttons button {
      background-color: #0088cc;
      color: white;
      border: none;
      padding: 10px 20px;
      margin: 0 10px;
      border-radius: 5px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .category-buttons button:hover,
    .category-buttons button.active {
      background-color: #006699;
    }
    .product {
      background-color: #111;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      padding: 20px;
      margin: 0 auto 30px;
      max-width: 350px;
      display: none; /* Masqué par défaut, on affichera via JS */
    }
    video {
      width: 100%;
      border-radius: 8px;
    }
    .product h2 {
      margin: 15px 0 5px;
      color: white;
    }
    .product p {
      font-size: 16px;
      color: #ccc;
      margin-bottom: 15px;
    }
    .product button {
      background-color: #0088cc;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      font-size: 15px;
      cursor: pointer;
    }
    .product button:hover {
      background-color: #006699;
    }
    button.close-btn {
      background-color: #444;
      margin-top: 20px;
      padding: 10px 20px;
      border-radius: 5px;
      font-size: 15px;
      cursor: pointer;
    }
    button.close-btn:hover {
      background-color: #222;
    }
  </style>
</head>
<body>

  <h1>CosaNostraShop</h1>
  <div class="subtitle">Livraison 7/7 — 14h à 00h</div>

  <div class="category-buttons">
    <button id="btn-all" class="active">Tous</button>
    <button id="btn-weed">Weed</button>
    <button id="btn-hash">Hash</button>
  </div>

  <!-- Produit 1 : Hash Dry -->
  <div class="product" data-category="hash">
    <video controls>
      <source src="https://cosaapp.github.io/Mini-app-/C465B181-B5CF-4BE4-AB9A-2EE261FB99B8.mp4" type="video/mp4">
      Votre navigateur ne supporte pas la lecture de vidéo.
    </video>
    <h2>Hash Dry</h2>
    <p>Prix : 5€ le gramme</p>
    <a href="https://www.snapchat.com/add/cosa2nostra" target="_blank">
      <button>Commander</button>
    </a>
  </div>

  <!-- Produit 2 : Weed -->
  <div class="product" data-category="weed">
    <video controls>
      <source src="https://raw.githubusercontent.com/cosaapp/Mini-app-/Main/2.mp4.MP4" type="video/mp4">
      Votre navigateur ne supporte pas la lecture de vidéo.
    </video>
    <h2>Weed</h2>
    <p>Prix : 8€ le gramme</p>
    <a href="https://www.snapchat.com/add/cosa2nostra" target="_blank">
      <button>Commander</button>
    </a>
  </div>

  <button class="close-btn" onclick="window.Telegram.WebApp.close()">Fermer l'app</button>

  <script>
    const btnAll = document.getElementById('btn-all');
    const btnWeed = document.getElementById('btn-weed');
    const btnHash = document.getElementById('btn-hash');
    const products = document.querySelectorAll('.product');
    const buttons = [btnAll, btnWeed, btnHash];

    function setActiveButton(activeBtn) {
      buttons.forEach(btn => {
        if (btn === activeBtn) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });
    }

    function showProducts(category) {
      products.forEach(product => {
        if (category === 'all' || product.dataset.category === category) {
          product.style.display = 'block';
        } else {
          product.style.display = 'none';
        }
      });
    }

    // Par défaut on affiche tous les produits
    showProducts('all');

    btnAll.addEventListener('click', () => {
      setActiveButton(btnAll);
      showProducts('all');
    });

    btnWeed.addEventListener('click', () => {
      setActiveButton(btnWeed);
      showProducts('weed');
    });

    btnHash.addEventListener('click', () => {
      setActiveButton(btnHash);
      showProducts('hash');
    });
  </script>

</body>
</html>
